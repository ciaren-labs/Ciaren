name: Security Audit

# Dependency vulnerability auditing for backend (pip-audit) and frontend +
# docs (npm audit). Complements Dependabot: Dependabot opens version-bump PRs
# on a schedule, while this fails CI when a *currently pinned* dependency has
# a known CVE. Gated at "high" so transitive low/moderate noise doesn't block
# PRs.

on:
  push:
    branches: [main]
    paths:
      - backend/pyproject.toml
      - backend/uv.lock
      - frontend/package.json
      - frontend/package-lock.json
      - docs/package.json
      - docs/package-lock.json
      - .github/workflows/security-audit.yml
  pull_request:
    branches: [main, '*dev']
    paths:
      - backend/pyproject.toml
      - backend/uv.lock
      - frontend/package.json
      - frontend/package-lock.json
      - docs/package.json
      - docs/package-lock.json
      - .github/workflows/security-audit.yml
  schedule:
    # Weekly so newly disclosed CVEs are caught even without a dependency change.
    - cron: "27 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: pip-audit (backend)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Audit resolved dependencies
        working-directory: backend
        # Audit the locked dependency set (all groups + ml extra), matching what
        # the test job installs. The export includes all transitive dependencies,
        # so audit the pinned entries without creating a pip environment.
        # Known vulnerabilities (including unfixable ones) fail the job;
        # --strict also fails on dependency-collection errors or skipped entries.
        run: |
          uv export --frozen --all-groups --extra ml --no-emit-project \
            --no-hashes --format requirements-txt > /tmp/requirements.txt
          uvx pip-audit --requirement /tmp/requirements.txt --no-deps --disable-pip --strict --progress-spinner off

  frontend:
    name: npm audit (frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit dependencies
        working-directory: frontend
        # Fail only on high/critical so moderate transitive advisories in dev
        # tooling don't block PRs; review those via the weekly Dependabot run.
        run: npm audit --audit-level=high

  docs:
    name: npm audit (docs)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        working-directory: docs
        run: npm ci

      - name: Audit dependencies
        working-directory: docs
        run: npm audit --audit-level=high

  summary:
    name: Security Audit Summary
    runs-on: ubuntu-latest
    needs: [backend, frontend, docs]
    if: always()

    steps:
      - name: Check results
        run: |
          if [ "${{ needs.backend.result }}" != "success" ] \
            || [ "${{ needs.frontend.result }}" != "success" ] \
            || [ "${{ needs.docs.result }}" != "success" ]; then
            echo "❌ Security audit failed"
            exit 1
          fi
          echo "✅ No high/critical vulnerabilities found"
