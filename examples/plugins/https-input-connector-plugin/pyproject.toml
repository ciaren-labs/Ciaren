[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ciaren-https-input-connector-plugin"
version = "0.1.0-alpha.1"
description = "Example Ciaren connector plugin for HTTPS CSV and JSON inputs."
requires-python = ">=3.12"
authors = [{ name = "Ciaren contributors" }]
license = { text = "Apache-2.0" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.entry-points."ciaren.plugins"]
https_input = "ciaren_https_input.plugin:HttpsInputPlugin"

[tool.hatch.build.targets.wheel]
packages = ["ciaren_https_input"]

